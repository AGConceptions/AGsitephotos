<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Photo Reminisce Proxy</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.png" type="image/png" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Black overlay to hide badge */
    .black-overlay {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 250px;         /* adjust width as needed */
      height: 65px;        /* covers from bottom upward */
      background-color: black;
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <iframe src="https://photo-reminisce-search.lovable.app/"></iframe>
  <div class="black-overlay"></div>

</body>
</html>
